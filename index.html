<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>直播Demo</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #remoteVideo {
            width: 100%;
            height: auto;
            max-height: 80vh; /* 确保视频不会超出视口高度 */
            object-fit: contain; /* 保持视频的宽高比 */
            border: 1px solid black; /* 可选: 给视频边框以区分 */
        }

        #loading {
            color: #4285f4;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4285f4;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            margin-bottom: -2px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .main-container {
            display: flex;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 0;
            box-shadow: none;
            background-color: #fff;
        }

        .left-section {
            display: flex;
            flex-direction: column;
            width: 250px;
            border-right: 1px solid #ddd;
            padding: 10px;
            box-sizing: border-box;
            background-color: #f0f0f0;
        }

        .image-section {
            display: flex;
            flex-direction: column;
            gap: 1px;
            padding: 10px 0;
            flex-grow: 1;
            overflow-y: auto;
        }

        .image-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .image-section img {
            width: 100px;
            height: 100px;
            cursor: pointer;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .image-section img:hover {
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.2);
        }

        .image-section img.selected {
            border-color: #4285f4;
        }

        figcaption {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-top: 5px;
        }

        .button-container {
            padding: 10px 0;
        }

        .button-container button {
            width: 100%;
            margin-bottom: 10px;
            background-color: #4285f4;
            color: white;
            border: none;
            padding: 10px 0;
            text-transform: uppercase;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .button-container button:hover {
            background-color: #357ae8;
        }

        .video-message-container {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .video-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative; /* 为了 text-display 绝对定位 */
        }

        .text-display {
            position: absolute;
            bottom: 8%;
            background-color: transparent;
            width: 30%;
            height: 30%;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            z-index: 1;
        }

        .question, .answer {
            margin-bottom: 20px;
        }

        .question {
            font-weight: bold;
            color: #333;
        }

        .answer {
            font-size: 14px;
            color: #666;
        }

        .message-section {
            display: flex;
            gap: 10px;
            padding: 20px;
            border-top: 1px solid #ddd;
            background-color: #f9f9f9;
        }

        .message-section input {
            flex-grow: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .message-section button {
            background-color: #4285f4;
            color: white;
            border: none;
            padding: 10px 20px;
            text-transform: uppercase;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .message-section button:hover {
            background-color: #357ae8;
        }
    </style>
</head>
<body>
<div class="main-container">
    <div class="left-section">
        <div class="image-section">
            <figure class="image-container">
                <img src="https://assets.psyai.net/public/217022646a6a52c478de0209092db159e8f31e14.png" data-virtualmankey="1f0565e823f5477ca31b5466d1d67c1f"  data-speaker="640241757c000a32e1ff0357" alt="Image 1">
                <figcaption>奇奇</figcaption>
            </figure>
        </div>
        <div class="button-container">
            <button id="startButton" disabled>开始会话</button>
            <button id="stopButton">结束会话</button>
            <div id="loading" style="display: none;">
                <div class="spinner"></div> 加载中，请稍候...</div>
            </div>
    </div>
    <div class="video-message-container">
        <div class="video-container">
            <video id="remoteVideo" controls autoplay playsinline></video>
            <div class="text-display">
                <div class="question" id="questionText"></div>
                <div class="answer" id="answerText"></div>
            </div>
        </div>
        <div class="message-section">
            <input type="text" id="messageInput" placeholder="输入消息...">
            <button id="sendMessageButton">发送消息</button>
        </div>
    </div>
</div>
<script src="webrtc.js"></script>
</body>
</html>
