<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>直播Demo</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .main-container {
            display: flex;
            width: calc(100% - 20px); /* 考虑边距，保持整体水平间距 */
        }

        .left-section {
            display: flex;
            flex-direction: column;
            width: 200px; /* 调整左侧部分的宽度 */
            height: 100%; /* 占满整体高度 */
        }

        .image-section {
            display: flex;
            flex-direction: column;
            gap: 1px; /* 较小的人物间距 */
            padding: 10px 0 0 0; /* 左右边距都设为0 */
            align-items: flex-start; /* 确保内容向左对齐 */
            flex-grow: 1; /* 占据剩余空间 */
            overflow-y: auto; /* 超过部分启用纵向滚动 */
        }

        .image-container {
            display: flex;
            flex-direction: column; /* 垂直排列 */
            align-items: center; /* 水平居中 */
            text-align: center; /* 确保文字居中 */
        }

        .image-section img {
            width: 95px;
            height: 95px;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.2);
            margin-bottom: 2px; /* 图片与文字之间的间距 */
            transition: box-shadow 0.3s;
        }

        .image-section img:hover {
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.3);
        }

        .image-section img.selected {
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.8);
            border: 2px solid #00ff00;
        }

        figcaption {
            font-size: 12px;
            font-weight: bold;
            color: #333;
            text-align: center; /* 确保文字居中展示 */
        }

        .button-container {
            margin-top: auto; /* 将按钮容器推到最底部 */
            padding: 10px 0; /* 内间距确保按钮不紧贴边框 */
            width: 100%;
            box-sizing: border-box; /* 使padding也算在width内 */
            background-color: #fff; /* 背景颜色与人物列表区分 */
        }

        .button-container button {
            width: 100%;
            margin-top: 5px; /* 按钮间的间距 */
            background-color: #4285f4; /* Google 蓝色 */
            color: white;
            border: none;
            padding: 10px 0;
            text-transform: uppercase;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .button-container button:hover {
            background-color: #357ae8; /* 悬停状态下稍深的颜色 */
        }

        .video-message-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-height: 100%; /* 确保不超出整体高度 */
        }

        .video-container {
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.15);
            border-radius: 4px;
            overflow: hidden; /* 剪切视频以让角变得圆滑 */
            width: 100%;
            flex-grow: 1; /* 占据剩余的空间 */
        }

        video {
            width: 100%;
            height: 100%; /* 使视频高度占满剩余空间 */
            object-fit: cover; /* 确保视频填充整个容器 */
        }

        .message-section {
            display: flex;
            gap: 10px;
            width: 100%;
            padding: 10px 0; /* 给输入框和按钮一些高度间距 */
            align-items: center;
        }

        .message-section input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            flex: 1;
        }

        .message-section button {
            background-color: #4285f4; /* Google 蓝色 */
            color: white;
            border: none;
            padding: 10px 20px;
            text-transform: uppercase;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .message-section button:hover {
            background-color: #357ae8; /* 悬停状态下稍深的颜色 */
        }
    </style>
</head>
<body>
<div class="main-container">
    <div class="left-section">
        <div class="image-section">
            <figure class="image-container">
                <img src="https://assets.psyai.net/public/217022646a6a52c478de0209092db159e8f31e14.png" data-virtualmankey="1f0565e823f5477ca31b5466d1d67c1f" alt="Image 1">
                <figcaption>奇奇</figcaption>
            </figure>
            <figure class="image-container">
                <img src="https://assets.psyai.net/public/217022646a6a52c478de0209092db159e8f31e14.png" data-virtualmankey="1f0565e823f5477caasd5dd7d67c1f" alt="Image 2">
                <figcaption>莉莉</figcaption>
            </figure>
            <!-- 添加更多人物 -->
        </div>
        <div class="button-container">
            <button id="startButton">开始会话</button>
            <button id="stopButton">结束会话</button>
        </div>
    </div>
    <div class="video-message-container">
        <div class="video-container">
            <video id="remoteVideo" controls autoplay playsinline></video>
        </div>
        <div class="message-section">
            <input type="text" id="messageInput" placeholder="输入消息...">
            <button id="sendMessageButton">发送消息</button>
        </div>
    </div>
</div>
<script src="webrtc.js"></script>
</body>
</html>
